[project]
name = "spotiparser"
version = "0.2.1"
description = "no-nonsense spotify profile data extractor"
authors = [
    {name = "Dev", email = "dev@example.local"},
]
dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
spotiparser = "spotiparser.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
